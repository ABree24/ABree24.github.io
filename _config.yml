# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Brender Akinyi
email: akinyi.brender@outlook.com
description: >- # this means to ignore newlines until "baseurl:" 
Portfolio of Brender Akinyi, an early-career cybersecurity professional based in Nairobi, Kenya, specializing
in security operations, threat detection and application security. Explore hands-on SIEM detection projects,
lab write-ups and a learning path spanning incident response, secure coding and data protection.
twitter_username: akinyi_brender
github_username: ABree24
minimal_mistakes_skin: neon
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Brender Akinyi"
  avatar : "/assets/images/Brender.jpg"
  avatar_shape: square  # or circle

  bio    : " Brender is a cybersecurity professional exploring threat detection, application security, and automation.
Always learning, building, and documenting the process."
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://abree24.github.io"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ABree24"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://ke.linkedin.com/brender-akinyi"

footer:
  links:

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ABree24"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://ke.linkedin.com/brender-akinyi"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
